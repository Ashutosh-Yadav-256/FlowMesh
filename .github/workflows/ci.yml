name: FlowMesh Production CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      STATE_STORE_PROVIDER: memory
      API_SECRET_KEY: test-secret-key-for-ci-must-be-long-enough-32-chars
      ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AGENT_ENROLLMENT_SECRET: test-agent-enrollment-secret-32-chars
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync

      - name: Run Pytest with Coverage
        run: uv run pytest tests/ -v --tb=short

      - name: Verify Alembic Migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend-build:
    name: Frontend Production Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript Types
        run: pnpm --filter web lint

      - name: Build Web Application
        run: pnpm --filter web build

  agent-test:
    name: Edge Agent Test Suite (Go 1.22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go Agent Tests
        run: |
          cd apps/agent
          go test ./... -v
