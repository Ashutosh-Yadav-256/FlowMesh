# ==============================================================================
# FlowMesh Enterprise - SonarQube & SonarCloud Configuration
# Multi-Language Enterprise Platform: Python, Java (Spring Boot), TypeScript, Go
# ==============================================================================

sonar.projectKey=flowmesh-enterprise-orchestrator
sonar.projectName=FlowMesh Enterprise Workflow Orchestrator
sonar.projectVersion=2.4.0

# Encoding & Source Roots
sonar.sourceEncoding=UTF-8
sonar.sources=apps,packages,services,connectors
sonar.tests=tests,services/enterprise-worker/src/test

# Language Inclusions & Exclusions
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/.next/**,**/build/**,**/target/**,**/*.pyc,**/__pycache__/**,**/coverage/**,**/lcov-report/**,**/*.hprof
sonar.test.inclusions=tests/**,services/enterprise-worker/src/test/**,**/*_test.go,**/*.spec.ts,**/*.test.tsx,**/*.test.ts,**/*Test.java

# Multi-Language Code Coverage Integration
# 1. Python (pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# 2. Java / Spring Boot (JaCoCo XML)
sonar.coverageJacocoXMLReportPaths=services/enterprise-worker/target/site/jacoco/jacoco.xml
sonar.java.binaries=services/enterprise-worker/target/classes
sonar.java.source=17

# 3. TypeScript / Next.js (Jest / Vitest LCOV)
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

# 4. Go (go test -coverprofile)
sonar.go.coverage.reportPaths=apps/agent/coverage.out

# Strict Quality Gate Enforcement
sonar.qualitygate.wait=true
sonar.coverage.dtdVerification=false

# Security & Bug Categorization
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
