server:
  port: 8082
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20000
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: flowmesh-enterprise-worker

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flowmesh}
    username: ${DB_USER:flowmesh}
    password: ${DB_PASSWORD:flowmesh_secure_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FlowMeshEnterpriseHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        generate_statistics: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:flowmesh}
    password: ${RABBITMQ_PASSWORD:flowmesh_secure_password}
    listener:
      simple:
        auto-startup: false
        retry:
          enabled: true
          max-attempts: 3

  artemis:
    mode: embedded
    embedded:
      enabled: true
      persistent: false
      queues: flowmesh.jms.queue,flowmesh.jms.dlq
      topics: flowmesh.jms.topic

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: flowmesh-enterprise-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jmx:
    enabled: true
    default-domain: io.flowmesh

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
    jmx:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: flowmesh-enterprise-worker
      environment: ${ENVIRONMENT:production}

logging:
  config: classpath:logback-spring.xml
