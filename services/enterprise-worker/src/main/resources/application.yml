server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: flowmesh-enterprise-worker

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flowmesh_enterprise}
    username: ${DB_USER:flowmesh}
    password: ${DB_PASSWORD:flowmesh_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FlowMeshEnterpriseHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        generate_statistics: false
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: flowmesh-enterprise-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: flowmesh-enterprise-worker
      environment: ${ENVIRONMENT:production}

logging:
  config: classpath:logback-spring.xml
