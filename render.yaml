services:
  - type: web
    name: flowmesh-api
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile.api
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowmesh-db
          property: connectionString
      - key: STATE_STORE_PROVIDER
        value: memory
      - key: API_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: AGENT_ENROLLMENT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["*"]'

  - type: web
    name: flowmesh-web
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile.web
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://flowmesh-api.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: flowmesh-db
    plan: free
    region: oregon
    databaseName: flowmesh
    user: flowmesh
