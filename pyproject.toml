[project]
name = "flowmesh"
version = "0.1.0"
description = "Client-owned, cloud-neutral enterprise integration and workflow platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "FlowMesh Contributors" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "nats-py>=2.9.0",
    "redis>=5.1.0",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "pandas>=2.2.0",
    "paramiko>=3.4.0",
    "prometheus-client>=0.20.0",
    "aiosqlite>=0.20.0",
    "boto3>=1.34.0",
    "pymysql>=1.2.0",
    "pymongo>=4.18.0",
    "oracledb>=26.0.0",
    "pymssql>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps/api", "packages", "packages/ai-scripting", "packages/search-engine", "packages/auth", "packages/state-store", "packages/connector-sdk", "packages/workflow-schema", "packages/data-transform", "services", "services/workflow-engine", "services/event-router", "services/incident-manager", "connectors", "."]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
