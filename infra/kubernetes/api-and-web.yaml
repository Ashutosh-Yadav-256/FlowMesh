apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowmesh-api
  namespace: flowmesh
  labels:
    app: flowmesh-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowmesh-api
  template:
    metadata:
      labels:
        app: flowmesh-api
    spec:
      containers:
        - name: api
          image: flowmesh/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: flowmesh-config
            - secretRef:
                name: flowmesh-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flowmesh-api
  namespace: flowmesh
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: flowmesh-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowmesh-web
  namespace: flowmesh
  labels:
    app: flowmesh-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowmesh-web
  template:
    metadata:
      labels:
        app: flowmesh-web
    spec:
      containers:
        - name: web
          image: flowmesh/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: flowmesh-config
                  key: NEXT_PUBLIC_API_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flowmesh-web
  namespace: flowmesh
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: flowmesh-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowmesh-ingress
  namespace: flowmesh
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
    - host: flowmesh.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: flowmesh-api
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: flowmesh-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowmesh-web
                port:
                  number: 3000
