apiVersion: v1
kind: ConfigMap
metadata:
  name: flowmesh-config
  namespace: flowmesh
data:
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql+asyncpg://flowmesh:flowmesh_secure_password@flowmesh-postgres:5432/flowmesh"
  NATS_URL: "nats://flowmesh-nats:4222"
  REDIS_URL: "redis://flowmesh-redis:6379/0"
  NEXT_PUBLIC_API_URL: "https://flowmesh.internal/api"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: flowmesh-secrets
  namespace: flowmesh
type: Opaque
stringData:
  API_SECRET_KEY: "prod-flowmesh-secret-key-at-least-32-chars-long-secure-entropy"
  ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  POSTGRES_USER: "flowmesh"
  POSTGRES_PASSWORD: "flowmesh_secure_password"
  POSTGRES_DB: "flowmesh"
