apiVersion: v1
kind: Namespace
metadata:
  name: flowmesh-enterprise
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flowmesh-sa
  namespace: flowmesh-enterprise
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flowmesh-sa-restricted-scc
  namespace: flowmesh-enterprise
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:restricted-v2
subjects:
  - kind: ServiceAccount
    name: flowmesh-sa
    namespace: flowmesh-enterprise
