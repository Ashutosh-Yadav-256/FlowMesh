apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowmesh-enterprise-worker
  namespace: flowmesh-enterprise
  labels:
    app.kubernetes.io/name: flowmesh-enterprise-worker
    app.kubernetes.io/component: transaction-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowmesh-enterprise-worker
  template:
    metadata:
      labels:
        app: flowmesh-enterprise-worker
    spec:
      serviceAccountName: flowmesh-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: image-registry.openshift-image-registry.svc:5000/flowmesh-enterprise/enterprise-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "openshift,production"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "flowmesh-kafka-bootstrap:9092"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowmesh-secrets
                  key: ENTERPRISE_DB_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flowmesh-enterprise-worker
  namespace: flowmesh-enterprise
spec:
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app: flowmesh-enterprise-worker
